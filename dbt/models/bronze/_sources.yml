version: 2

sources:
  - name: tpch
    description: >
      TPC-H benchmark data (scale factor 1) shared by Snowflake. A wholesale supplier:
      customers place orders made of line items; each line item is a part bought from a supplier.
    database: SNOWFLAKE_SAMPLE_DATA
    schema: TPCH_SF1
    tables:
      - name: region
      - name: nation
      - name: customer
      - name: supplier
      - name: part
      - name: partsupp
      - name: orders
      - name: lineitem

  - name: kam_input
    description: >
      Data typed by people, not rebuilt by dbt: the Key Account Manager's call log, filled in
      through the Streamlit form KAM_CALLS (see snowflake/01_kam_calls.sql).
    database: TPCH_MEDALLION
    schema: KAM_INPUT
    tables:
      - name: call_log
        description: One row per call logged by the Key Account Manager.
