version: 2

models:
  - name: dim_date
    description: Calendar, one row per day.
    columns:
      - name: date_key
        description: YYYYMMDD.
        data_tests: [unique, not_null]

  - name: dim_customer
    description: >
      The Key Account Manager's portfolio: customers of one segment and country
      (vars portfolio_segment and portfolio_nation, Furniture in the United Kingdom), with nation and region in one table.
    columns:
      - name: customer_key
        description: Customer identifier, same value as customer_id in Silver.
        data_tests: [unique, not_null]
      - name: market_segment
        description: Industry the customer buys for. Always the portfolio segment.
        data_tests:
          - accepted_values:
              arguments:
                values: ["{{ var('portfolio_segment') }}"]
      - name: customer_nation
        description: Country of the customer. Always the portfolio nation.
        data_tests:
          - accepted_values:
              arguments:
                values: ["{{ var('portfolio_nation') }}"]
      - name: customer_region
        description: Continent of the customer's country.
      - name: account_balance
        description: Balance of the customer's account with us. Negative = the customer owes money.
      - name: phone
        description: Phone number, shown in the Power BI tooltip of the worklist.
      - name: address
        description: Address, shown in the Power BI tooltip of the worklist.
      - name: contact_person
        description: Initials of the contact person. SYNTHETIC (demo data, see slv_customer).

  - name: dim_customer_call_status
    description: >
      Whether the Key Account Manager called each portfolio customer recently. View, so a call
      logged in the Streamlit form shows up at the next Power BI refresh without running dbt.
    columns:
      - name: customer_key
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_key
      - name: last_called_at
        description: Last call logged (empty if never called).
      - name: recent_calls
        description: Calls in the last called_window_days days (7).
      - name: call_status
        description: Called = at least one call in the last 7 days; Not called otherwise.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Called', 'Not called']
      - name: call_status_order
        description: 1 = Not called, 2 = Called (sorts "Not called" first in Power BI).

  - name: fct_orders
    description: >
      One row per order of the portfolio's customers, with its revenue and delivery outcome.
      Used for trends and drill-down.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_key
      - name: order_date_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: order_lines
        description: Number of lines (products) in the order.
      - name: net_revenue
        description: Revenue after discount.
      - name: delivered_date
        description: Date the last line of the order was received.
      - name: late_lines
        description: Lines received after the date committed to the customer.
      - name: is_late
        description: At least one line arrived after the committed date.

  - name: fct_account_health
    description: >
      One row per portfolio customer that has ever ordered: activity, revenue trend and service
      quality on the as-of date, three risk signals and the resulting risk level.
      Tier and service issues rank the portfolio's accounts against each other.
      The Key Account Manager's weekly worklist.
    columns:
      - name: customer_key
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_key
      - name: as_of_date
        description: Reference date of the snapshot - the last day of the last complete month of data (1998-07-31). Later orders are ignored.
      - name: account_tier
        description: A = top 20% of the portfolio's accounts by lifetime revenue, B = next 30%, C = rest.
        data_tests:
          - accepted_values:
              arguments:
                values: ['A', 'B', 'C']
      - name: days_since_last_order
        description: Days between the customer's last order and the as-of date.
      - name: avg_days_between_orders
        description: >
          The customer's usual rhythm: average days between two orders over its whole history.
          Empty for customers with a single order.
      - name: orders_last_12m
        description: Orders placed in the 12 months before the as-of date. 0 = Inactive.
      - name: revenue_change_pct
        description: Revenue of the last 12 months vs the previous 12 months.
      - name: late_line_rate_12m
        description: >
          Share of order lines received after the committed date, last 12 months, counting only
          orders already delivered on the as-of date. Empty when there is nothing delivered to measure.
          Measured per line because almost every TPC-H order has at least one late line.
      - name: is_overdue
        description: No order for more than overdue_factor x the customer's usual time between orders.
      - name: is_declining
        description: Last-12-month revenue fell more than decline_threshold.
      - name: has_service_issues
        description: >
          Account is in the worst 25% of the portfolio by share of late lines in the last 12 months,
          ranked only against the accounts that have a late_line_rate_12m.
      - name: risk_signals
        description: How many of the three signals (overdue, declining, service issues) are on.
        data_tests:
          - value_between:
              arguments:
                min_value: 0
                max_value: 3
      - name: risk_level
        description: Inactive (no order in 12 months), High (2-3 signals), Medium (1), Low (0).
        data_tests:
          - accepted_values:
              arguments:
                values: ['Inactive', 'High', 'Medium', 'Low']
      - name: revenue_at_risk
        description: Last-12-month revenue of active accounts with at least one risk signal.
        data_tests:
          - value_between:
              arguments:
                min_value: 0

unit_tests:
  - name: test_account_health_risk_rules
    description: >
      Four made-up customers, one per risk level, checked against results worked out by hand.
      The last order in the data is 1998-08-02, so the as-of date is the end of the last
      complete month: 1998-07-31.
        1 Low      - steady buyer, revenue growing, no late lines.
        2 Inactive - last order 1997-01-01 (no order in 12 months). Its revenue also fell,
                     but Inactive wins over any signal and its revenue at risk is 0.
        3 High     - usually orders every ~112 days but nothing for 333 days (overdue) and
                     revenue fell from 6,000 to 200 (declining). Biggest buyer, so tier A.
        4 Medium   - 3 of every 4 lines arrive late, the worst of the accounts with deliveries
                     (service issues). Customer 2 has no deliveries to measure and is left out
                     of that ranking.
      The 1998-08-02 order of customer 1 is after the as-of date, so it is ignored completely
      (revenue, last order and service quality).
    model: fct_account_health
    given:
      - input: ref('slv_orders')
        rows:
          - {order_date: 1998-08-02}
      - input: ref('fct_orders')
        rows:
          - {customer_key: 1, order_date: 1996-09-01, net_revenue: 100, order_lines: 4, late_lines: 0, delivered_date: 1996-09-20}
          - {customer_key: 1, order_date: 1997-03-01, net_revenue: 100, order_lines: 4, late_lines: 0, delivered_date: 1997-03-20}
          - {customer_key: 1, order_date: 1997-09-01, net_revenue: 100, order_lines: 4, late_lines: 0, delivered_date: 1997-09-20}
          - {customer_key: 1, order_date: 1998-03-01, net_revenue: 100, order_lines: 4, late_lines: 0, delivered_date: 1998-03-20}
          - {customer_key: 1, order_date: 1998-08-02, net_revenue: 100, order_lines: 4, late_lines: 4, delivered_date: 1998-08-20}
          - {customer_key: 2, order_date: 1996-01-01, net_revenue: 1000, order_lines: 4, late_lines: 0, delivered_date: 1996-01-20}
          - {customer_key: 2, order_date: 1997-01-01, net_revenue: 1000, order_lines: 4, late_lines: 0, delivered_date: 1997-01-20}
          - {customer_key: 3, order_date: 1996-10-01, net_revenue: 2000, order_lines: 4, late_lines: 0, delivered_date: 1996-10-20}
          - {customer_key: 3, order_date: 1996-11-01, net_revenue: 2000, order_lines: 4, late_lines: 0, delivered_date: 1996-11-20}
          - {customer_key: 3, order_date: 1997-01-01, net_revenue: 2000, order_lines: 4, late_lines: 0, delivered_date: 1997-01-20}
          - {customer_key: 3, order_date: 1997-09-01, net_revenue: 200, order_lines: 4, late_lines: 0, delivered_date: 1997-09-20}
          - {customer_key: 4, order_date: 1997-10-01, net_revenue: 300, order_lines: 4, late_lines: 3, delivered_date: 1997-10-20}
          - {customer_key: 4, order_date: 1998-02-01, net_revenue: 300, order_lines: 4, late_lines: 3, delivered_date: 1998-02-20}
          - {customer_key: 4, order_date: 1998-06-01, net_revenue: 300, order_lines: 4, late_lines: 3, delivered_date: 1998-06-20}
    expect:
      rows:
        - {customer_key: 1, as_of_date: 1998-07-31, account_tier: C, late_line_rate_12m: 0,    is_overdue: false, is_declining: false, has_service_issues: false, risk_level: Low,      revenue_at_risk: 0}
        - {customer_key: 2, as_of_date: 1998-07-31, account_tier: B, late_line_rate_12m: null, is_overdue: false, is_declining: true,  has_service_issues: false, risk_level: Inactive, revenue_at_risk: 0}
        - {customer_key: 3, as_of_date: 1998-07-31, account_tier: A, late_line_rate_12m: 0,    is_overdue: true,  is_declining: true,  has_service_issues: false, risk_level: High,     revenue_at_risk: 200}
        - {customer_key: 4, as_of_date: 1998-07-31, account_tier: C, late_line_rate_12m: 0.75, is_overdue: false, is_declining: false, has_service_issues: true,  risk_level: Medium,   revenue_at_risk: 900}

exposures:
  - name: key_account_health_cockpit
    label: Key Account Health Cockpit
    type: dashboard
    description: >
      Weekly worklist for the Key Account Manager of Furniture accounts in the United Kingdom:
      which accounts are at risk, why, and how much revenue is at stake.
      The Power BI report shows only the key accounts (tier A) over the last 12 complete months.
    depends_on:
      - ref('fct_account_health')
      - ref('fct_orders')
      - ref('dim_customer')
      - ref('dim_customer_call_status')
      - ref('dim_date')
    owner:
      name: Key Account Manager - Furniture, United Kingdom
