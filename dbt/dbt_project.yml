name: tpch_medallion
version: "1.0.0"
config-version: 2

profile: tpch_medallion

vars:
  # Portfolio of the Key Account Manager who consumes the Gold layer.
  # Gold only contains these accounts; change both values to serve another KAM.
  portfolio_segment: Furniture
  portfolio_region: Europe

  # Business thresholds of the account-health score (Key Account Managers can tune them)
  overdue_factor: 2         # overdue = no order for more than 2x the customer's usual interval
  decline_threshold: 0.3    # declining = last-12-month revenue down more than 30%

models:
  tpch_medallion:
    +materialized: table
    bronze:
      +schema: bronze
    silver:
      +schema: silver
    gold:
      +schema: gold
