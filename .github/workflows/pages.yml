name: Publish website

on:
  push:
    branches: [main]
    paths:
      - "web_publica/**"
      - "powerbi/diccionario.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Add the dictionary
        run: cp powerbi/diccionario.html web_publica/diccionario.html
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: web_publica
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
