<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diccionario KAM Health</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Roboto:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EDEBEB; --card: #FFFFFF; --border: #DEDADA;
    --text: #292626; --muted: #6E6969; --navy: #0E3A5B; --blue: #2B7BB9;
    --teal: #176366; --accent: #6BD9DE; --chip: #F4F2F2; --code: #EEF3F6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15191E; --card: #1F252C; --border: #333B44;
      --text: #E8E6E6; --muted: #A39E9E; --navy: #AAE9EC; --blue: #6BB3E6;
      --teal: #6BD9DE; --accent: #6BD9DE; --chip: #272E36; --code: #27313B;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15191E; --card: #1F252C; --border: #333B44;
    --text: #E8E6E6; --muted: #A39E9E; --navy: #AAE9EC; --blue: #6BB3E6;
    --teal: #6BD9DE; --accent: #6BD9DE; --chip: #272E36; --code: #27313B;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.55 Inter, 'Segoe UI', system-ui, sans-serif; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 24px 16px 48px; }
  header { background: var(--card); border: 1px solid var(--border); border-radius: 22px;
           padding: 22px 24px; margin-bottom: 16px; }
  .brand { display: flex; align-items: center; gap: 10px; color: var(--teal);
           font: 600 12px/1 Inter, sans-serif; letter-spacing: .08em; text-transform: uppercase; }
  .brand i { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); display: inline-block; }
  h1 { font: 700 26px/1.25 Roboto, 'Segoe UI Semibold', sans-serif; color: var(--navy); margin: 10px 0 6px; }
  .intro { color: var(--muted); margin: 0; max-width: 70ch; }
  .tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 18px; }
  .langs { display: inline-flex; border: 1px solid var(--border); border-radius: 999px; overflow: hidden; }
  .langs button { border: 0; background: transparent; color: var(--text); padding: 7px 14px;
                  font: 500 13px Inter, sans-serif; cursor: pointer; }
  .langs button[aria-pressed="true"] { background: var(--navy); color: var(--card); }
  input[type=search] { flex: 1 1 220px; min-width: 0; padding: 8px 14px; border-radius: 999px;
                       border: 1px solid var(--border); background: var(--card); color: var(--text);
                       font: 14px Inter, sans-serif; }
  nav { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 16px; }
  nav a { text-decoration: none; color: var(--navy); background: var(--card); border: 1px solid var(--border);
          border-radius: 999px; padding: 5px 12px; font-size: 13px; }
  nav a:hover { border-color: var(--blue); }
  section { margin-bottom: 22px; }
  h2 { font: 700 18px/1.3 Roboto, 'Segoe UI Semibold', sans-serif; color: var(--navy); margin: 0 0 4px; }
  .sec-intro { color: var(--muted); margin: 0 0 10px; font-size: 14px; }
  dl { margin: 0; display: grid; gap: 10px; }
  .entry { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 14px 18px; }
  dt { font: 600 16px/1.35 Inter, sans-serif; color: var(--navy); }
  .other { color: var(--muted); font-weight: 400; font-size: 13px; margin-left: 6px; }
  dd { margin: 6px 0 0; }
  .meta { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; color: var(--muted); }
  code { background: var(--code); color: var(--text); border-radius: 6px; padding: 1px 6px;
         font: 12px Consolas, 'Cascadia Mono', monospace; }
  .empty { color: var(--muted); padding: 20px 4px; }
  footer { color: var(--muted); font-size: 13px; margin-top: 28px; }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; vertical-align: middle; margin-right: 4px; }
  @media print { .tools, nav { display: none; } body { background: #fff; } .entry, header { break-inside: avoid; } }
</style>
</head>

const LANGS = ["en", "es", "ca"];
let lang = "es";
try { const s = localStorage.getItem("kam-dict-lang"); if (LANGS.includes(s)) lang = s; } catch (e) {}

const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");

function render() {
  const u = UI[lang], q = norm(document.getElementById("q").value.trim());
  document.documentElement.lang = lang;
  document.getElementById("brand").textContent = u.brand;
  document.getElementById("h1").textContent = u.h1;
  document.getElementById("intro").textContent = u.intro;
  document.getElementById("q").placeholder = u.search;
  document.getElementById("foot").textContent = u.foot;
  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  document.getElementById("nav").innerHTML = SECTIONS.map(s => `<a href="#${s.id}">${esc(s[lang][0])}</a>`).join("");

  let html = "", hits = 0;
  for (const s of SECTIONS) {
    const items = s.items.filter(it => !q || norm(LANGS.map(l => it[l].join(" ")).join(" ") + " " + (it.field || "")).includes(q));
    if (!items.length) continue;
    hits += items.length;
    html += `<section id="${s.id}"><h2>${esc(s[lang][0])}</h2><p class="sec-intro">${esc(s[lang][1])}</p><dl>`;
    for (const it of items) {
      const others = LANGS.filter(l => l !== lang && it[l][0] !== it[lang][0]).map(l => `${l.toUpperCase()}: ${esc(it[l][0])}`).join(" · ");
      const sw = it.sw ? `<span class="sw" style="background:${it.sw}"></span>` : "";
      html += `<div class="entry"><dt>${sw}${esc(it[lang][0])}${others ? `<span class="other">${others}</span>` : ""}</dt><dd>${esc(it[lang][1])}</dd>`;
      if (it.field) html += `<div class="meta">${esc(u.field)}: ${it.field.split(" · ").map(f => `<code>${esc(f)}</code>`).join(" ")}</div>`;
      html += `</div>`;
    }
    html += `</dl></section>`;
  }
  document.getElementById("main").innerHTML = hits ? html : `<p class="empty">${esc(u.none)}</p>`;
}

document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.lang;
  try { localStorage.setItem("kam-dict-lang", lang); } catch (e) {}
  render();
}));
document.getElementById("q").addEventListener("input", render);
render();
</script>
