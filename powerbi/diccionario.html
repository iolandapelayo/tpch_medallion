<style>
  :root {

    --code: #F4F6F8; --head: #2D3540;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page: #1B2027; --text: #E8E6E6; --muted: #A6A1A1; --card: #232A33; --line: #343C47;
      --soft: #2A323C; --code: #1B2027; --head: #E8E6E6; --teal: #6BD9DE; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --page: #1B2027; --text: #E8E6E6; --muted: #A6A1A1; --card: #232A33; --line: #343C47;
    --soft: #2A323C; --code: #1B2027; --head: #E8E6E6; --teal: #6BD9DE; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--page); color: var(--text); font: 16px/1.6 Inter, 'Segoe UI', system-ui, sans-serif; }
  .inner { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

  /* hero: slate band like the career site */
  .hero { background: var(--slate); color: #fff; position: relative; overflow: hidden; }
  .hero .inner { position: relative; padding-top: 22px; padding-bottom: 56px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .wordmark { font: 500 22px/1 Inter, sans-serif; color: var(--turq); letter-spacing: -.01em; }
  .wordmark small { display: block; font-size: 11px; color: var(--turq-soft); margin-top: 3px; letter-spacing: .02em; }
  .flags { display: flex; gap: 8px; }
  .flags button { padding: 0; border: 2px solid transparent; border-radius: 6px; background: none; cursor: pointer;
                  opacity: .55; transition: opacity .15s; }
  .flags button:hover { opacity: .9; }
  .flags button[aria-pressed="true"] { opacity: 1; border-color: var(--turq); }
  .flags img { display: block; width: 33px; height: 22px; border-radius: 3px; }
  .hero-body { max-width: 640px; margin-top: 52px; position: relative; z-index: 1; }
  h1 { font: 700 clamp(34px, 6vw, 56px)/1.1 Roboto, 'Segoe UI Semibold', sans-serif; margin: 0 0 16px; }
  .intro { margin: 0; color: #D9DEE3; font-size: 17px; }
  .shape { position: absolute; right: -40px; bottom: -40px; width: 330px; height: 330px; opacity: .95; }
  @media (max-width: 760px) { .shape { width: 200px; height: 200px; right: -70px; bottom: -70px; opacity: .35; } }

  .search { margin-top: 28px; display: flex; max-width: 520px; }
  input[type=search] { width: 100%; padding: 12px 20px; border-radius: 40px; border: 0; background: #fff; color: #292626;
                       font: 15px Inter, sans-serif; }
  input[type=search]:focus { outline: 3px solid var(--turq); }

  nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; background: var(--page); border-bottom: 1px solid var(--line); }
  nav .inner { display: flex; gap: 8px; overflow-x: auto; padding-top: 12px; padding-bottom: 12px; scrollbar-width: none; }
  nav a { flex: none; text-decoration: none; font: 600 14px Inter, sans-serif; color: var(--head);
          border: 2px solid var(--turq); border-radius: 40px; padding: 6px 16px; }
  nav a:hover { background: var(--turq); color: #fff; }

  main { padding: 40px 0 24px; }
  section { margin-bottom: 48px; scroll-margin-top: 70px; }
  h2 { font: 700 30px/1.2 Roboto, 'Segoe UI Semibold', sans-serif; color: var(--head); margin: 0 0 6px; }
  .sec-intro { color: var(--muted); margin: 0 0 20px; }
  dl { margin: 0; display: grid; gap: 14px; }
  .entry { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 18px 22px;
           border-left: 4px solid var(--turq); }
  dt { font: 600 19px/1.35 Inter, sans-serif; color: var(--head); }
  .other { display: block; color: var(--muted); font-weight: 400; font-size: 13px; margin-top: 2px; }
  dd { margin: 8px 0 0; }
  .calc { margin-top: 14px; padding: 12px 16px; border-radius: 8px; background: var(--soft); }
  .calc-h { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font: 600 13px/1.3 Inter, sans-serif; color: var(--teal); }
  .tag { font: 600 11px/1 Inter, sans-serif; color: var(--slate); background: var(--turq-soft);
         border-radius: 40px; padding: 4px 10px; }
  .calc p { margin: 6px 0 0; font-size: 15px; }
  .calc pre { margin: 10px 0 0; padding: 10px 12px; background: var(--code); border: 1px solid var(--line); border-radius: 6px;
              overflow-x: auto; font: 12.5px/1.55 Consolas, 'Cascadia Mono', monospace; white-space: pre; color: var(--text); }
  .meta { margin-top: 10px; font-size: 12.5px; color: var(--muted); }
  code { background: var(--soft); color: var(--text); border-radius: 4px; padding: 1px 6px; font: 12.5px Consolas, 'Cascadia Mono', monospace; }
  .sw { display: inline-block; width: 12px; height: 12px; border-radius: 50%; vertical-align: 1px; margin-right: 8px; }
  .empty { color: var(--muted); padding: 20px 0; }
  footer { background: var(--slate); color: #C9CFD6; font-size: 14px; }
  footer .inner { padding-top: 28px; padding-bottom: 28px; }
  footer b { color: var(--turq); font-weight: 500; }
  @media print { nav, .search, .flags, .shape { display: none; } .entry, .calc { break-inside: avoid; } }
</style>
</head>

    ca: "Mesura Total revenue at risk a l'eix de valors i Nivell de risc a l'eix de categories.",
    code: "Y = [Total revenue at risk]    X = 'Account Health'[Risk level]" },
  "Monthly revenue by risk level": { src: "pq",
    en: "Measure Revenue by month, with one line per risk level.",
    es: "Medida Ingresos por mes, con una línea por nivel de riesgo.",
    ca: "Mesura Ingressos per mes, amb una línia per nivell de risc.",
    code: "Y = [Revenue]    X = Date[Month start]    Series = 'Account Health'[Risk level]" },
  "Worklist for this week": { src: "pq",
    en: "One row per account, sorted by the Revenue at risk column, descending.",
    es: "Una fila por cuenta, ordenada por la columna Ingresos en riesgo, de mayor a menor.",
    ca: "Una fila per compte, ordenada per la columna Ingressos en risc, de més a menys.",
    code: "Customer · Risk level · Revenue at risk · Revenue change % · Signals\nsort: 'Account Health'[Revenue at risk] DESC" }
};

const LANGS = ["en", "es", "ca"];
let lang = "es";
try { const s = localStorage.getItem("kam-dict-lang"); if (LANGS.includes(s)) lang = s; } catch (e) {}

const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");

function render() {
  const u = UI[lang], q = norm(document.getElementById("q").value.trim());
  document.documentElement.lang = lang;
  document.getElementById("h1").textContent = u.h1;
  document.getElementById("intro").textContent = u.intro;
  document.getElementById("q").placeholder = u.search;
  document.getElementById("foot").innerHTML = u.foot;
  document.querySelectorAll(".flags button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  document.getElementById("nav").innerHTML = SECTIONS.map(s => `<a href="#${s.id}">${esc(s[lang][0])}</a>`).join("");

  let html = "", hits = 0;
  for (const s of SECTIONS) {
    const items = s.items.filter(it => {
      const c = CALC[it.en[0]];
      const text = LANGS.map(l => it[l].join(" ") + (c ? " " + c[l] : "")).join(" ") + " " + (it.field || "") + (c ? " " + c.code : "");
      return !q || norm(text).includes(q);
    });
    if (!items.length) continue;
    hits += items.length;
    html += `<section id="${s.id}"><h2>${esc(s[lang][0])}</h2><p class="sec-intro">${esc(s[lang][1])}</p><dl>`;
    for (const it of items) {
      const others = LANGS.filter(l => l !== lang && it[l][0] !== it[lang][0]).map(l => `${l.toUpperCase()}: ${esc(it[l][0])}`).join(" · ");
      const sw = it.sw ? `<span class="sw" style="background:${it.sw}"></span>` : "";
      html += `<div class="entry"><dt>${sw}${esc(it[lang][0])}${others ? `<span class="other">${others}</span>` : ""}</dt><dd>${esc(it[lang][1])}`;
      const c = CALC[it.en[0]];
      if (c) html += `<div class="calc"><div class="calc-h">${esc(u.calc)}<span class="tag">${esc(u[c.src])}</span></div><p>${esc(c[lang])}</p><pre>${esc(c.code)}</pre></div>`;
      if (it.field) html += `<div class="meta">${esc(u.field)}: ${it.field.split(" · ").map(f => `<code>${esc(f)}</code>`).join(" ")}</div>`;
      html += `</dd></div>`;
    }
    html += `</dl></section>`;
  }
  document.getElementById("main").innerHTML = hits ? html : `<p class="empty">${esc(u.none)}</p>`;
}

document.querySelectorAll(".flags button").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.lang;
  try { localStorage.setItem("kam-dict-lang", lang); } catch (e) {}
  render();
}));
document.getElementById("q").addEventListener("input", render);
render();
</script>
</body>
</html>
